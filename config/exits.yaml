defaults:
  stop_loss_pct: 5            # sell if price <= entry * (1 - 0.05) — tightened from 8 to react sooner
  atr_stop_mult: 0            # 0 = flat stop above. >0 = volatility-scaled: stop = mult*ATR/price,
                              # clamped to [0.5x, 2x] the flat stop (wider on high-vol names to cut
                              # whipsaw). Try ~2.5 to enable; left off so the backtest baseline holds.
  atr_period: 14              # ATR lookback for the volatility-scaled stop
  take_profit_pct: 20         # used only when take_profit_mode is 'hard'
  take_profit_mode: trailing  # 'trailing' lets winners run; 'hard' caps at take_profit_pct
  trailing_stop_pct: 6        # sell if price <= peak_since_entry * (1 - 0.06) — tightened from 12 to protect gains on a sharp dip
  trend_break_fast: 20        # MA period; emits a 'watch' (advisory) signal only
  trend_break_slow: 50        # MA period for the slow trend-break signal
  trend_break_slow_level: watch  # 'watch' = advisory (trailing stop owns exits); 'sell' = closes the trade
  momentum_fade:
    rsi_was_above: 70         # had been overbought...
    volume_dry_ratio: 0.7     # ...and volume now < 0.7x its 20-day average
backtest:
  buy_threshold: 65           # simulate a buy when base score >= this
  max_hold_days: 250          # generous cap (~1yr) so the trailing stop, not a clock, exits winners
  window_years: 2             # how much history to replay (base backtest)
  cost_pct_per_side: 0.1      # 0.2% round-trip slippage/commission
  baseline: equal_weight_watchlist
  # Flat short-term-capital-gains haircut on WINNING trades, applied only by the ENRICHED
  # backtest (run_enriched). This is the tax drag daily trading pays that buy-and-hold does
  # not — the hurdle any active edge must clear. 0 = off (base backtest is unaffected).
  stcg_tax_pct: 25
  enriched_years: 4           # longer window for the enriched backtest, to span both the
                              # 2022 drawdown and the 2023-24 rally (don't overfit one regime)
