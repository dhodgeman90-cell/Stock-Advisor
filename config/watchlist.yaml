tickers:
  - AAPL
  - NVDA
  - AMD
  - MSFT
  - TSLA
  - AMZN
  - META
  - GOOGL
  - NFLX
  - AVGO
settings:
  shortlist_size: 8
  lookback_days: 200
  min_price: 5.0
  min_avg_volume: 500000        # legacy share-count floor (no longer used by scoring)
  min_dollar_volume: 10000000   # liquidity gate: $10M/day traded value (price x shares)
  entry_model: relative_strength  # re-rank the shortlist by relative strength vs SPY + constructive
                                  # pullback (fixes the "inverted top band"); scorecard forward-tests it
  regime_overlay: true            # defensive mode: recommend no new buys in a CONFIRMED risk-off
                                  # regime (reduces drawdown; does NOT beat the index in a bull market)
