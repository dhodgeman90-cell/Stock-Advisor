tickers:
  - AAPL
  - NVDA
  - AMD
  - MSFT
  - TSLA
  - AMZN
  - META
  - GOOGL
  - NFLX
  - AVGO
settings:
  shortlist_size: 8
  lookback_days: 200
  min_price: 5.0
  min_avg_volume: 500000        # legacy share-count floor (no longer used by scoring)
  min_dollar_volume: 10000000   # liquidity gate: $10M/day traded value (price x shares)
  control_cohort_size: 15         # MEASUREMENT ONLY — never ranked, shown, or recommended.
                                  # The enriched shortlist is picked by the legacy technical
                                  # score, which is not random: it selects 20-day highs on
                                  # volume spikes. Capturing signal history only there would
                                  # let us ask "does analyst upside predict returns AMONG
                                  # BREAKOUT NAMES" and nothing more. These 15 random eligible
                                  # names are the unbiased comparison group. 0 disables.
  adds_paused: true               # withhold BUY calls. The sell side (exits/trims on open
                                  # positions) stays fully live, and candidates are still
                                  # scored and shown — labelled "Candidate", never "Buy".
                                  #
                                  # NOT "pending validation" any more. Validation happened, six
                                  # times, most recently 2026-09-09 on ~1,800 daily
                                  # cross-sections: base_score rank-IC vs forward excess return
                                  # is -0.005 at 5d, ~zero at every horizon, sign-flipping year
                                  # to year. There is no edge to switch back on. Leave true.

  quiet_unless_actionable: true   # email ONLY when a holding trips an exit rule.
                                  # The run still happens every day and the report is still
                                  # written — the daily signal capture is what makes any of
                                  # this answerable later. What stops is the daily notification
                                  # about a screen with no measured edge, which manufactures
                                  # the urge to act. Turnover is the one thing measured to be
                                  # monotonically destructive here (+1.9% at 70 trades ->
                                  # -18.9% at 350). Set false to get the mail every morning.

  ai_mode: off                    # off | measure | live
                                  # The news/risk/social agents drove 223 of 353 "Buy:" verdicts
                                  # ever printed and have NEVER been validated in either
                                  # direction. Unvalidated is not refuted, so they are switched
                                  # off rather than deleted.
                                  #
                                  #   off     — never called, no tokens spent (current)
                                  #   measure — called and captured to data/ai_history.jsonl,
                                  #             but given ZERO influence on score, verdict or
                                  #             page. Costs a few cents a day and is the only
                                  #             way "does the news agent predict anything?"
                                  #             ever becomes answerable. Same trick as the
                                  #             control cohort, which is what made the
                                  #             2026-09-09 analysis possible at all.
                                  #   live    — agents score and render (the legacy default)
  # --- both OFF pending Phase 2/3 (2026-07-27 audit) ---
  # entry_model: relative_strength
  #   Re-ranks only INSIDE the 25 names the legacy breakout+volume pre-filter already chose,
  #   and cross_sectional_rank is computed over that shortlist, so the 55-point RS term is
  #   renormalized 0..1 within an already-weak pool and carries no absolute strength signal.
  #   It also has zero backtest and zero forward test (rs_entry_rank is called only from
  #   main.py and appears nowhere in backtest.py). Re-enable once ranking moves upstream of
  #   the pre-filter (Phase 2) and a full-universe backtest exists (Phase 3).
  # regime_overlay: true
  #   Its own kill criterion returned "DO NOT SHIP" (3 of 4 checks FAIL) in
  #   reports/backtest-regime-default-2026-07-27.md. Re-enable only after the gate is
  #   re-specified to match its actual claim (drawdown reduction, not alpha) and passes.
