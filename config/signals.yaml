# Tunables for the daily-swing signal sources (social, congress, insights).
# Anything omitted here falls back to the built-in defaults in src/config.py.

thresholds:
  congress_large_usd: 50000   # disclosure size that counts as a "big" trade
  social_min_mentions: 25     # ignore WSB buzz below this many mentions
  earnings_window_days: 5     # demote new entries with earnings within N days

discovery:
  congress_lookback_days: 30  # how recently a trade must have been disclosed to surface
  top_n: 8                    # max rows in the "outside the watchlist" discovery feed
