# Optional per-ticker exit overrides.
#
# Your holdings now sync automatically from your brokerage via SnapTrade, so you no longer
# list what you own here. Use this file only to override exit thresholds for a specific
# ticker (these merge on top of the live SnapTrade holding). It also doubles as the fallback
# source if a SnapTrade sync ever fails.
#
# Example:
# positions:
#   - ticker: NVDA
#     stop_loss_pct: 10
#     take_profit_pct: 25
#     trailing_stop_pct: 12
#     entry_date: 2026-06-01
# Real purchase dates, supplied by the owner 2026-07-27. SnapTrade does not return a
# purchase date, so without these the trailing stop would track the peak only from the day
# the first-seen store was created (2026-07-27) and would not protect gains already banked.
positions:
  - ticker: QURE
    entry_date: 2026-06-17
  - ticker: GOOGL
    entry_date: 2026-06-29
  - ticker: AMZN
    entry_date: 2026-07-07
  - ticker: JPM
    entry_date: 2026-07-22
