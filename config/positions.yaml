# Optional per-ticker exit overrides.
#
# Your holdings now sync automatically from your brokerage via SnapTrade, so you no longer
# list what you own here. Use this file only to override exit thresholds for a specific
# ticker (these merge on top of the live SnapTrade holding). It also doubles as the fallback
# source if a SnapTrade sync ever fails.
#
# Example:
# positions:
#   - ticker: NVDA
#     stop_loss_pct: 10
#     take_profit_pct: 25
#     trailing_stop_pct: 12
#     entry_date: 2026-06-01
# Manual entry_date pins are no longer needed: broker.fetch_entry_dates derives the true
# position-open date from the brokerage activity feed (see src/broker.py). The pins that were
# briefly here on 2026-07-27 have been removed — one of them was WRONG in a way that hid an
# exit. QURE was pinned to 2026-06-17, which was the last ADD to the position; it actually
# opened 2025-12-05, and the correct date fires a time_exit (234 days held vs a 180-day max)
# that the pinned date suppressed. Derived dates are exact and need no maintenance.
#
# Still use this file to OVERRIDE a derived value (it wins over everything) or to pin exit
# widths per ticker.
positions: []
